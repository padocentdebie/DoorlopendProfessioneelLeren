<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Docentenoverleg Digibord</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, push, update, remove, set, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBj8dXkl1rEfyx54_MDy_tYd2P7kAeU8VQ",
            authDomain: "q2les3samirgem.firebaseapp.com",
            databaseURL: "https://q2les3samirgem-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "q2les3samirgem",
            storageBucket: "q2les3samirgem.firebasestorage.app",
            messagingSenderId: "8681998187",
            appId: "1:8681998187:web:fd08067494a010dc572e2e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Referenties
        const slidesRef = ref(db, 'docentenoverleg/slides');
        const currentSlideRef = ref(db, 'docentenoverleg/currentSlide');
        const leaderNotesRef = ref(db, 'docentenoverleg/leaderNotes');
        const usersRef = ref(db, 'docentenoverleg/users');

        // UI-elementen
        const statusLabel = document.getElementById('status');
        const slideDisplay = document.getElementById('slide-content');
        const currentSlideIndicator = document.getElementById('current-slide');
        const userNameInput = document.getElementById('user-name-input');
        const roleSelect = document.getElementById('role-select');
        const passwordInput = document.getElementById('password-input');
        const passwordDiv = document.getElementById('password-div');
        const loginModal = document.getElementById('login-modal');
        const editSlidesModal = document.getElementById('edit-slides-modal');
        const leaderNotesModal = document.getElementById('leader-notes-modal');
        const noteModal = document.getElementById('note-modal');
        const noteTextInput = document.getElementById('note-text-input');
        const noteColorSelect = document.getElementById('note-color-select');
        const notesContainer = document.getElementById('notes-container');
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');
        const userInfoDiv = document.getElementById('user-info');
        const chairButtons = document.getElementById('chair-buttons');
        const logoutBtn = document.getElementById('logout-btn');

        // Globale variabelen
        let currentUser = '';
        let currentRole = '';
        let slides = [];
        let currentSlideIndex = 0;
        let notes = {};
        let drawings = {};
        let isDrawing = false;
        let currentPathId = null;
        let draggingNote = null;
        let dragOffset = {x:0, y:0};
        let trashZone = document.getElementById('trash-zone');

        // Dynamische refs
        let notesRef = null;
        let drawingsRef = null;
        let notesListener = null;
        let drawingsListener = null;

        // Initialisatie
        window.addEventListener('DOMContentLoaded', () => {
            loginModal.style.display = 'flex';

            onValue(ref(db, '.info/connected'), (snap) => {
                if (snap.val()) {
                    statusLabel.innerText = '● LIVE';
                    statusLabel.classList.add('online');
                } else {
                    statusLabel.innerText = '● OFFLINE';
                    statusLabel.classList.remove('online');
                }
            });

            // Slides laden
            onValue(slidesRef, (snap) => {
                slides = snap.val() || [];
                if (slides.length === 0) {
                    const defaultSlides = [
                        { title: 'Doel', content: '' },
                        { title: 'Context', content: '' },
                        { title: 'Werkwijze', content: '' },
                        { title: 'Opdracht', content: '' }
                    ];
                    set(slidesRef, defaultSlides);
                }
            });

            // Huidige slide
            onValue(currentSlideRef, (snap) => {
                const newIndex = snap.val() || 0;
                if (newIndex !== currentSlideIndex) {
                    currentSlideIndex = newIndex;
                    setupSlideDataListeners();
                    updateSlideDisplay();
                } else {
                    setupSlideDataListeners();
                    updateSlideDisplay();
                }
            });

            // Gebruikerslijst (voor weergave en uitloggen bij reset)
            onValue(usersRef, (snap) => {
                const users = snap.val() || {};
                // Toon lijst van ingelogde collega's
                const names = Object.keys(users);
                userInfoDiv.innerHTML = names.length > 0 ? 'Ingelogd: ' + names.join(', ') : 'Niemand ingelogd';
                // Controleer of huidige gebruiker nog bestaat, anders uitloggen
                if (currentUser && !users[currentUser]) {
                    currentUser = '';
                    currentRole = '';
                    document.getElementById('user-name-display').innerText = '';
                    chairButtons.style.display = 'none';
                    logoutBtn.style.display = 'none';
                    loginModal.style.display = 'flex';
                }
            });
        });

        // ====== Login ======
        document.getElementById('login-btn').addEventListener('click', () => {
            const name = userNameInput.value.trim();
            const role = roleSelect.value;
            const password = passwordInput.value;

            if (!name) {
                alert('Voer je naam in.');
                return;
            }
            if (role === 'voorzitter') {
                if (password !== 'docent') {
                    alert('Onjuist wachtwoord voor voorzitter.');
                    return;
                }
            }

            currentUser = name;
            currentRole = role;

            // Opslaan in Firebase
            const userRef = ref(db, 'docentenoverleg/users/' + name);
            set(userRef, { name: name, role: role, online: true });
            onDisconnect(userRef).remove();

            // UI aanpassen
            loginModal.style.display = 'none';
            document.getElementById('user-name-display').innerText = `Ingelogd als: ${name}`;
            if (role === 'voorzitter') {
                chairButtons.style.display = 'flex';
                logoutBtn.style.display = 'inline-block';
            } else {
                chairButtons.style.display = 'none';
                logoutBtn.style.display = 'none';
            }
        });

        // Wachtwoordveld tonen/verbergen bij rolkeuze
        roleSelect.addEventListener('change', () => {
            if (roleSelect.value === 'voorzitter') {
                passwordDiv.style.display = 'block';
            } else {
                passwordDiv.style.display = 'none';
            }
        });

        // ====== Handmatige uitlog ======
        logoutBtn.addEventListener('click', () => {
            if (currentUser) {
                const userRef = ref(db, 'docentenoverleg/users/' + currentUser);
                remove(userRef);
                currentUser = '';
                currentRole = '';
                document.getElementById('user-name-display').innerText = '';
                chairButtons.style.display = 'none';
                logoutBtn.style.display = 'none';
                loginModal.style.display = 'flex';
            }
        });

        // ====== Slide weergave ======
        function updateSlideDisplay() {
            const slide = slides[currentSlideIndex];
            if (slide) {
                slideDisplay.innerHTML = `<h2>${slide.title}</h2><p>${slide.content}</p>`;
                currentSlideIndicator.innerText = `Slide ${currentSlideIndex + 1} / ${slides.length}`;
            } else {
                slideDisplay.innerHTML = '<h2>Geen slide</h2>';
                currentSlideIndicator.innerText = `Slide 0 / 0`;
            }
        }

        // ====== Volgende / Vorige knoppen ======
        document.getElementById('next-btn').addEventListener('click', () => {
            if (currentSlideIndex < slides.length - 1) {
                set(currentSlideRef, currentSlideIndex + 1);
            }
        });
        document.getElementById('prev-btn').addEventListener('click', () => {
            if (currentSlideIndex > 0) {
                set(currentSlideRef, currentSlideIndex - 1);
            }
        });

        document.getElementById('next-screen-btn').addEventListener('click', () => {
            document.getElementById('next-btn').click();
        });

        // ====== Slides bewerken (alleen voorzitter) ======
        document.getElementById('edit-slides-btn').addEventListener('click', () => {
            const list = document.getElementById('slides-edit-list');
            list.innerHTML = '';
            slides.forEach((slide, index) => {
                const div = document.createElement('div');
                div.className = 'slide-edit-item';
                div.innerHTML = `
                    <input type="text" id="title-${index}" value="${slide.title}" placeholder="Titel">
                    <textarea id="content-${index}" placeholder="Inhoud">${slide.content}</textarea>
                    <button onclick="removeSlide(${index})">Verwijder</button>
                `;
                list.appendChild(div);
            });
            editSlidesModal.style.display = 'flex';
        });

        document.getElementById('save-slides-btn').addEventListener('click', () => {
            const newSlides = [];
            const listItems = document.querySelectorAll('.slide-edit-item');
            listItems.forEach((item, index) => {
                const title = document.getElementById(`title-${index}`).value.trim();
                const content = document.getElementById(`content-${index}`).value.trim();
                newSlides.push({ title, content });
            });
            set(slidesRef, newSlides);
            editSlidesModal.style.display = 'none';
        });

        document.getElementById('add-slide-btn').addEventListener('click', () => {
            const list = document.getElementById('slides-edit-list');
            const index = list.children.length;
            const div = document.createElement('div');
            div.className = 'slide-edit-item';
            div.innerHTML = `
                <input type="text" id="title-${index}" placeholder="Titel">
                <textarea id="content-${index}" placeholder="Inhoud"></textarea>
                <button onclick="removeSlide(${index})">Verwijder</button>
            `;
            list.appendChild(div);
        });

        window.removeSlide = (index) => {
            const list = document.getElementById('slides-edit-list');
            if (list.children[index]) list.children[index].remove();
        };

        // ====== Nieuw scherm ======
        document.getElementById('add-screen-btn').addEventListener('click', () => {
            const newSlide = { title: 'Nieuw scherm', content: '' };
            const updatedSlides = [...slides, newSlide];
            set(slidesRef, updatedSlides);
            set(currentSlideRef, updatedSlides.length - 1);
        });

        // ====== Leader aantekeningen (alleen voorzitter) ======
        document.getElementById('leader-notes-btn').addEventListener('click', () => {
            const textarea = document.getElementById('leader-notes-text');
            onValue(leaderNotesRef, (snap) => {
                const notesData = snap.val() || {};
                textarea.value = notesData[currentSlideIndex] || '';
            });
            leaderNotesModal.style.display = 'flex';
        });

        document.getElementById('save-leader-notes-btn').addEventListener('click', () => {
            const text = document.getElementById('leader-notes-text').value;
            const updateObj = {};
            updateObj[currentSlideIndex] = text;
            update(leaderNotesRef, updateObj);
            leaderNotesModal.style.display = 'none';
        });

        document.getElementById('close-leader-notes-btn').addEventListener('click', () => {
            leaderNotesModal.style.display = 'none';
        });

        // ====== Sticky notes ======
        document.getElementById('add-note-btn').addEventListener('click', () => {
            noteTextInput.value = '';
            noteColorSelect.value = 'green';
            noteModal.style.display = 'flex';
        });

        document.getElementById('confirm-note-btn').addEventListener('click', () => {
            const text = noteTextInput.value.trim() || 'Nieuwe notitie';
            const color = noteColorSelect.value;
            const noteRef = push(notesRef);
            const note = {
                text: text,
                x: 200 + Math.random() * 300,
                y: 200 + Math.random() * 300,
                color: color,
                author: currentUser,
                reactions: []
            };
            set(noteRef, note);
            noteModal.style.display = 'none';
        });

        document.getElementById('cancel-note-btn').addEventListener('click', () => {
            noteModal.style.display = 'none';
        });

        // ====== Setup listeners per slide ======
        function setupSlideDataListeners() {
            // Oude listeners opruimen
            if (notesListener) notesListener();
            if (drawingsListener) drawingsListener();

            // Dynamische refs
            notesRef = ref(db, `docentenoverleg/notes/${currentSlideIndex}`);
            drawingsRef = ref(db, `docentenoverleg/drawings/${currentSlideIndex}`);

            // Lege containers
            notesContainer.innerHTML = '';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            notes = {};
            drawings = {};

            // Notities listener (onValue)
            notesListener = onValue(notesRef, (snap) => {
                const data = snap.val() || {};
                const dataIds = Object.keys(data);

                // Verwijder notities die er niet meer zijn
                Object.keys(notes).forEach(id => {
                    if (!dataIds.includes(id)) {
                        const el = document.getElementById(`note-${id}`);
                        if (el) el.remove();
                        delete notes[id];
                    }
                });

                // Voeg nieuwe notities toe of update bestaande
                dataIds.forEach(id => {
                    const note = data[id];
                    note.id = id;

                    if (notes[id]) {
                        // Bestaande notitie: update positie/kleur/tekst, maar niet tijdens slepen
                        if (draggingNote !== id) {
                            updateStickyNoteElement(note);
                        }
                        notes[id] = note;
                    } else {
                        // Nieuwe notitie
                        notes[id] = note;
                        createStickyNoteElement(note);
                    }
                });
            });

            // Tekeningen listener
            drawingsListener = onValue(drawingsRef, (snap) => {
                drawings = snap.val() || {};
                redrawAllDrawings();
            });
        }

        // Sticky note element aanmaken
        function createStickyNoteElement(note) {
            const el = document.createElement('div');
            el.className = 'sticky-note';
            el.id = `note-${note.id}`;
            el.style.left = note.x + 'px';
            el.style.top = note.y + 'px';
            el.style.backgroundColor = note.color;
            el.dataset.author = note.author;
            el.innerHTML = `
                <div class="note-header">
                    <span class="note-author">${note.author}</span>
                    <span class="note-color-picker">
                        <span class="color-dot green" data-color="green"></span>
                        <span class="color-dot red" data-color="red"></span>
                        <span class="color-dot blue" data-color="blue"></span>
                    </span>
                    <span class="note-delete" title="Verwijder">×</span>
                </div>
                <div class="note-text" contenteditable="true">${note.text}</div>
                <div class="note-reactions">
                    ${note.reactions.map(r => `<div class="reaction">${r.author}: ${r.text}</div>`).join('')}
                </div>
                <div class="reaction-input">
                    <input type="text" placeholder="Reageer...">
                    <button>OK</button>
                </div>
            `;
            notesContainer.appendChild(el);

            // Event listeners
            el.addEventListener('pointerdown', startDragging);
            el.querySelector('.note-text').addEventListener('input', (e) => {
                const newText = e.target.innerText;
                update(notesRef, { [note.id]: { ...note, text: newText } });
            });
            el.querySelectorAll('.color-dot').forEach(dot => {
                dot.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const color = dot.dataset.color;
                    update(notesRef, { [note.id]: { ...note, color } });
                });
            });
            el.querySelector('.note-delete').addEventListener('click', (e) => {
                e.stopPropagation();
                remove(notesRef, note.id);
            });
            const reactionInput = el.querySelector('.reaction-input input');
            const reactionBtn = el.querySelector('.reaction-input button');
            reactionBtn.addEventListener('click', () => {
                const text = reactionInput.value.trim();
                if (text) {
                    const newReactions = [...note.reactions, { author: currentUser, text }];
                    update(notesRef, { [note.id]: { ...note, reactions: newReactions } });
                    reactionInput.value = '';
                }
            });
        }

        // Update bestaande notitie
        function updateStickyNoteElement(note) {
            const el = document.getElementById(`note-${note.id}`);
            if (!el) return;
            el.style.left = note.x + 'px';
            el.style.top = note.y + 'px';
            el.style.backgroundColor = note.color;
            const textEl = el.querySelector('.note-text');
            if (textEl.innerText !== note.text && !textEl.isContentEditable) {
                textEl.innerText = note.text;
            }
            const reactionsDiv = el.querySelector('.note-reactions');
            reactionsDiv.innerHTML = note.reactions.map(r => `<div class="reaction">${r.author}: ${r.text}</div>`).join('');
        }

        // ====== Slepen ======
        function startDragging(e) {
            e.preventDefault();
            const el = e.currentTarget;
            const noteId = el.id.replace('note-', '');
            const note = notes[noteId];
            if (!note) return;

            draggingNote = noteId;
            const rect = canvas.getBoundingClientRect();
            dragOffset.x = (e.clientX - rect.left) * (canvas.width / rect.width) - note.x;
            dragOffset.y = (e.clientY - rect.top) * (canvas.height / rect.height) - note.y;

            el.setPointerCapture(e.pointerId);
        }

        window.addEventListener('pointermove', (e) => {
            if (!draggingNote) return;
            const note = notes[draggingNote];
            if (!note) return;

            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width) - dragOffset.x;
            const y = (e.clientY - rect.top) * (canvas.height / rect.height) - dragOffset.y;

            update(notesRef, { [draggingNote]: { ...note, x, y } });

            const trashRect = trashZone.getBoundingClientRect();
            if (e.clientX > trashRect.left && e.clientX < trashRect.right && e.clientY > trashRect.top && e.clientY < trashRect.bottom) {
                trashZone.classList.add('active');
            } else {
                trashZone.classList.remove('active');
            }
        });

        window.addEventListener('pointerup', () => {
            if (draggingNote && trashZone.classList.contains('active')) {
                remove(notesRef, draggingNote);
            }
            draggingNote = null;
            trashZone.classList.remove('active');
        });

        // ====== Tekenfunctie ======
        canvas.addEventListener('pointerdown', (e) => {
            if (e.target === canvas) {
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) * (canvas.width / rect.width);
                const y = (e.clientY - rect.top) * (canvas.height / rect.height);
                const newPathRef = push(drawingsRef);
                currentPathId = newPathRef.key;
                const path = { points: [{ x, y }] };
                set(newPathRef, path);
                isDrawing = true;
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing || !currentPathId) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);
            const path = drawings[currentPathId];
            if (path && path.points) {
                const last = path.points[path.points.length - 1];
                if (Math.hypot(x - last.x, y - last.y) > 5) {
                    const newPoints = [...path.points, { x, y }];
                    update(drawingsRef, { [currentPathId]: { points: newPoints } });
                }
            }
        });

        window.addEventListener('pointerup', () => {
            isDrawing = false;
            currentPathId = null;
        });

        function drawPath(path) {
            ctx.strokeStyle = '#4b5563';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(path.points[0].x, path.points[0].y);
            path.points.forEach(p => ctx.lineTo(p.x, p.y));
            ctx.stroke();
        }

        function redrawAllDrawings() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            Object.values(drawings).forEach(path => drawPath(path));
        }

        // ====== Download / Print PDF ======
        document.getElementById('print-btn').addEventListener('click', () => {
            document.body.classList.add('print-mode');
            const canvasImg = canvas.toDataURL('image/png');
            const img = document.createElement('img');
            img.src = canvasImg;
            img.id = 'canvas-print-img';
            img.style.width = '100%';
            document.getElementById('print-area').appendChild(img);
            window.print();
            document.body.classList.remove('print-mode');
            document.getElementById('print-area').innerHTML = '';
        });

        // ====== Reset ======
        document.getElementById('reset-btn').addEventListener('click', () => {
            if (confirm('Weet je zeker dat je ALLE gegevens wilt wissen? Iedereen wordt ook uitgelogd.')) {
                if (notesListener) notesListener();
                if (drawingsListener) drawingsListener();
                remove(slidesRef);
                remove(ref(db, 'docentenoverleg/notes'));
                remove(ref(db, 'docentenoverleg/drawings'));
                remove(leaderNotesRef);
                remove(usersRef);
                set(currentSlideRef, 0);
                currentUser = '';
                currentRole = '';
                document.getElementById('user-name-display').innerText = '';
                chairButtons.style.display = 'none';
                logoutBtn.style.display = 'none';
                loginModal.style.display = 'flex';
                notes = {};
                drawings = {};
                notesContainer.innerHTML = '';
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                setTimeout(() => setupSlideDataListeners(), 500);
            }
        });

        // ====== Bordwisknop (alleen huidige slide) ======
        document.getElementById('clear-board-btn').addEventListener('click', () => {
            if (confirm('Wil je alle sticky notes en tekeningen op dit scherm wissen?')) {
                if (notesListener) notesListener();
                if (drawingsListener) drawingsListener();
                remove(notesRef);
                remove(drawingsRef);
                notes = {};
                drawings = {};
                notesContainer.innerHTML = '';
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                setTimeout(() => setupSlideDataListeners(), 100);
            }
        });

        // ====== Sluit modals ======
        window.onclick = function(event) {
            if (event.target === loginModal) loginModal.style.display = 'none';
            if (event.target === editSlidesModal) editSlidesModal.style.display = 'none';
            if (event.target === leaderNotesModal) leaderNotesModal.style.display = 'none';
            if (event.target === noteModal) noteModal.style.display = 'none';
        };
    </script>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #e0e7ff, #f0f2f5);
            margin: 0;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #1e3a8a;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            z-index: 200;
        }
        header h1 { margin: 0; font-size: 1.3rem; }
        .header-controls { display: flex; gap: 8px; align-items: center; }
        .btn {
            background: #3b82f6;
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .btn:hover { background: #2563eb; }
        .btn.secondary { background: #6b7280; }
        .btn.red { background: #dc2626; }
        .btn.green { background: #16a34a; }
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 10px;
            min-height: 0;
        }
        .slide-display {
            background: #ffffff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            min-height: 120px;
        }
        .slide-display h2 { margin-top: 0; color: #1e3a8a; }
        .slide-display p { font-size: 1.2rem; }
        .slide-nav { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
        .digibord {
            flex: 1;
            position: relative;
            background: #ffffff;
            border-radius: 10px;
            border: 3px solid #1e3a8a;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            overflow: hidden;
            touch-action: none;
            min-height: 300px;
        }
        #drawing-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: crosshair; }
        #notes-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .sticky-note {
            position: absolute;
            width: 200px;
            min-height: 150px;
            background: #fef08a;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            padding: 10px;
            pointer-events: auto;
            cursor: move;
            display: flex;
            flex-direction: column;
            font-size: 14px;
        }
        .note-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .note-author { font-weight: bold; font-size: 0.9em; background: rgba(0,0,0,0.1); padding: 2px 5px; border-radius: 3px; }
        .note-color-picker { display: flex; gap: 4px; }
        .color-dot { width: 15px; height: 15px; border-radius: 50%; cursor: pointer; border: 1px solid #ccc; }
        .color-dot.green { background: #22c55e; }
        .color-dot.red { background: #ef4444; }
        .color-dot.blue { background: #3b82f6; }
        .note-delete { cursor: pointer; color: #888; font-size: 18px; line-height: 1; }
        .note-delete:hover { color: red; }
        .note-text { flex: 1; outline: none; word-wrap: break-word; margin-bottom: 5px; }
        .note-reactions { background: rgba(255,255,255,0.6); border-radius: 5px; padding: 5px; max-height: 80px; overflow-y: auto; margin-bottom: 5px; }
        .reaction { font-size: 0.85em; }
        .reaction-input { display: flex; gap: 5px; margin-top: 5px; }
        .reaction-input input { flex: 1; border: 1px solid #ccc; border-radius: 4px; padding: 4px; font-size: 12px; }
        .reaction-input button { background: #3b82f6; color: white; border: none; border-radius: 4px; padding: 0 8px; cursor: pointer; font-size: 12px; }
        #trash-zone {
            position: absolute; top: 10px; left: 10px; width: 60px; height: 60px;
            background: #fee2e2; border: 2px dashed #ef4444; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 28px;
            opacity: 0.7; transition: 0.2s; z-index: 10; pointer-events: auto;
        }
        #trash-zone.active { transform: scale(1.1); background: #ef4444; opacity: 1; border-style: solid; color: white; }
        .digibord-toolbar {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.95); border-radius: 30px; padding: 8px 20px;
            display: flex; gap: 10px; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 20; flex-wrap: wrap;
        }
        .digibord-toolbar button {
            background: none; border: none; cursor: pointer; font-size: 1.2rem; padding: 5px;
            display: flex; align-items: center; gap: 5px; font-size: 0.9rem;
        }
        .digibord-toolbar button:hover { background: #e5e7eb; border-radius: 20px; }
        #status { font-size: 0.9rem; padding: 4px 10px; border-radius: 20px; background: #eee; }
        #status.online { background: #ebffed; color: #2e7d32; }
        #user-info { font-size: 0.9rem; padding: 4px 10px; border-radius: 20px; background: rgba(255,255,255,0.2); }
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 300;
        }
        .modal-content {
            background: white; padding: 20px; border-radius: 10px; max-width: 600px; width: 90%;
            max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .modal-content h2 { margin-top: 0; }
        .slide-edit-item { border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .slide-edit-item input, .slide-edit-item textarea { width: 100%; margin-bottom: 5px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; }
        .slide-edit-item textarea { height: 60px; }
        .print-mode .header-controls, .print-mode .slide-nav, .print-mode .digibord-toolbar, .print-mode .modal, .print-mode #trash-zone, .print-mode .note-reactions .reaction-input, .print-mode .note-color-picker, .print-mode .note-delete { display: none !important; }
        .print-mode .digibord { border: 1px solid #ccc; box-shadow: none; }
        #print-area { display: none; }
        @media print {
            .main-container { display: block; padding: 0; }
            .slide-display { page-break-after: always; border: 1px solid #ccc; margin-bottom: 20px; }
            .digibord { page-break-after: always; border: 2px solid #333; }
            #canvas-print-img { width: 100%; }
            .sticky-note { break-inside: avoid; }
        }
        @media (max-width: 768px) {
            .digibord { height: 60vh !important; }
            .slide-display { min-height: 80px; }
            .sticky-note { width: 160px; }
        }
        /* Verberg voorzitterknoppen standaard */
        #chair-buttons { display: none; }
        #logout-btn { display: none; }
        #password-div { display: none; }
    </style>
</head>
<body>

<header>
    <h1>📋 Docentenoverleg Digibord</h1>
    <div class="header-controls">
        <span id="status">Status: Laden...</span>
        <div id="chair-buttons" style="display: none;">
            <button id="edit-slides-btn" class="btn">✏️ Slides bewerken</button>
            <button id="leader-notes-btn" class="btn secondary">📝 Aantekeningen</button>
            <button id="print-btn" class="btn green">🖨️ Download PDF</button>
            <button id="reset-btn" class="btn red">🗑️ Reset</button>
        </div>
        <button id="logout-btn" class="btn secondary" style="display: none;">🚪 Uitloggen</button>
        <span id="user-name-display" style="font-size: 0.9rem;"></span>
        <span id="user-info" style="font-size: 0.9rem; margin-left: 10px;"></span>
    </div>
</header>

<div class="main-container">
    <div class="slide-display">
        <div id="slide-content"></div>
        <div class="slide-nav">
            <button id="prev-btn" class="btn secondary">← Vorige</button>
            <span id="current-slide" style="font-weight: bold; margin: 0 10px;"></span>
            <button id="next-btn" class="btn">Volgende →</button>
        </div>
    </div>

    <div class="digibord">
        <canvas id="drawing-canvas" width="1200" height="800"></canvas>
        <div id="notes-container"></div>
        <div id="trash-zone">🗑️</div>
        <div class="digibord-toolbar">
            <button id="add-note-btn" title="Nieuwe sticky note">
                <span>📌</span> Notitie
            </button>
            <span style="border-left: 1px solid #ccc; height: 20px;"></span>
            <button id="next-screen-btn" title="Volgend scherm">⏭️</button>
            <button id="add-screen-btn" title="Nieuw scherm toevoegen">
                <span>➕</span> Nieuw scherm
            </button>
            <button id="clear-board-btn" title="Wis sticky notes en tekeningen van dit scherm">
                <span>🧹</span> Wis bord
            </button>
        </div>
    </div>
</div>

<!-- Login modal -->
<div id="login-modal" class="modal" style="display: flex;">
    <div class="modal-content" style="max-width: 400px;">
        <h2>Welkom!</h2>
        <p>Voer je naam en rol in.</p>
        <label for="user-name-input">Naam:</label>
        <input type="text" id="user-name-input" placeholder="Je naam" style="width: 100%; padding: 10px; margin-bottom: 10px;">
        <label for="role-select">Rol:</label>
        <select id="role-select" style="width: 100%; padding: 10px; margin-bottom: 10px;">
            <option value="deelnemer">Deelnemer</option>
            <option value="voorzitter">Voorzitter</option>
        </select>
        <div id="password-div" style="width: 100%; margin-bottom: 10px;">
            <label for="password-input">Wachtwoord:</label>
            <input type="password" id="password-input" placeholder="Wachtwoord" style="width: 100%; padding: 10px;">
        </div>
        <button id="login-btn" class="btn" style="width: 100%;">Start</button>
    </div>
</div>

<!-- Notitie modal -->
<div id="note-modal" class="modal">
    <div class="modal-content" style="max-width: 400px;">
        <h2>Nieuwe notitie</h2>
        <label for="note-text-input">Tekst:</label>
        <textarea id="note-text-input" style="width: 100%; height: 80px; margin: 10px 0;" placeholder="Typ hier je notitie..."></textarea>
        <label for="note-color-select">Kleur:</label>
        <select id="note-color-select" style="width: 100%; margin-bottom: 10px;">
            <option value="green">Groen</option>
            <option value="red">Rood</option>
            <option value="blue">Blauw</option>
        </select>
        <div style="text-align: right;">
            <button id="confirm-note-btn" class="btn">Toevoegen</button>
            <button id="cancel-note-btn" class="btn secondary">Annuleren</button>
        </div>
    </div>
</div>

<!-- Edit slides modal -->
<div id="edit-slides-modal" class="modal">
    <div class="modal-content">
        <h2>Bewerk slides</h2>
        <div id="slides-edit-list"></div>
        <button id="add-slide-btn" class="btn secondary">+ Nieuwe slide</button>
        <div style="text-align: right; margin-top: 10px;">
            <button id="save-slides-btn" class="btn">Opslaan</button>
            <button class="btn secondary" onclick="document.getElementById('edit-slides-modal').style.display='none'">Annuleren</button>
        </div>
    </div>
</div>

<!-- Leader notes modal -->
<div id="leader-notes-modal" class="modal">
    <div class="modal-content">
        <h2>Aantekeningen voor huidige slide</h2>
        <textarea id="leader-notes-text" style="width: 100%; height: 200px; margin-bottom: 10px;" placeholder="Schrijf hier je aantekeningen..."></textarea>
        <div style="text-align: right;">
            <button id="save-leader-notes-btn" class="btn">Opslaan</button>
            <button id="close-leader-notes-btn" class="btn secondary">Sluiten</button>
        </div>
    </div>
</div>

<div id="print-area"></div>

</body>
</html>
